name: "norminette-ci"
description: "Run the 42 norminette to lint on C sources"
author: 0verlight
branding:
  icon: flag
  color: red
inputs:
  paths:
    description: "Space-separated files/directories to check"
    required: false
    default: "."
  global-allowed:
    description: "If true, global variable notices don't fail the check"
    required: false
    default: "false"
  python-version:
    description: "Python version to install"
    required: false
    default: '3.11'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: |
          python3 -m pip install -U norminette
    - shell: bash
      env:
         NORM_PATHS: ${{ inputs.paths }}
         NORM_GLOBAL_ALLOWED: ${{ inputs.global-allowed }}
      run: ${{ github.action_path }}/norminette.sh
